[workspace]
resolver = "2"
members = ["os_core", "kernel", "tools/membench"]
default-members = ["os_core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
os_core = { path = "os_core" }

[profile.release]
opt-level = 2
debug = 1
lto = "thin"
panic = "abort"
