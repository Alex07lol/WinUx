timeout: 0
serial: yes
serial_baudrate: 115200
verbose: no
default_entry: 1

/PROJECT_OS
    protocol: limine
    path: boot():/boot/kernel.elf
    module_path: boot():/boot/hello.elf
    module_path: boot():/boot/fault.elf
    module_path: boot():/boot/bad.elf
    module_path: boot():/boot/pehello.exe
    module_path: boot():/boot/pebad.exe
    module_path: boot():/boot/peconsole.exe
    module_path: boot():/boot/pebadimp.exe
    module_path: boot():/boot/pebadfn.exe
    cmdline: boot.mode=normal debug_exit
    resolution: 1280x800x32
